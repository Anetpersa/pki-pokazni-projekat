<p>question works!</p>

<div class="mb-3">
    <input type="text" class="form-control" [(ngModel)]="search" (keyup)="loadQuestions()">
</div>

{{search}}

@if (webData().length > 0) {
<div class="accordion accordion-flush" id="accordionFlushExample">
    @for (q of webData(); track q.questionId) {
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                [attr.data-bs-target]="'#flush-collapse-' + q.questionId" aria-expanded="false"
                [attr.aria-controls]="'flush-collapse-' + q.questionId">
                {{ q.text }}
            </button>
        </h2>
        <div [id]="'flush-collapse-' + q.questionId" class="accordion-collapse collapse"
            data-bs-parent="#accordionFlushExample">
            <div class="accordion-body" [innerHTML]="convertToLinks(q.answer || q.text)">
            </div>
        </div>
    </div>
    }
</div>
} @else {
<div class="loading">
    <h1>Podaci se učitavaju!</h1>
    <p>Sačekajte dok se podaci učitaju.</p>
</div>
}
